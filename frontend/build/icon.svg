<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Main circle -->
  <circle cx="256" cy="256" r="180" fill="url(#circle)" filter="url(#shadow)"/>
  
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  
  <!-- Letter C with shadow -->
  <text x="256" y="340" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="240" font-weight="700" fill="white" text-anchor="middle" filter="url(#shadow)">C</text>
  
  <!-- Subtle sparkles -->
  <circle cx="140" cy="140" r="8" fill="white" opacity="0.6"/>
  <circle cx="380" cy="150" r="6" fill="white" opacity="0.5"/>
  <circle cx="370" cy="380" r="7" fill="white" opacity="0.4"/>
</svg>

